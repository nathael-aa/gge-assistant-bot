name: Strip Comments and Push to Main

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run comment stripper
        run: python strip_comments.py

      - - name: Push clean code to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mv production /tmp/production_temp
          
          git checkout main
          
          cp -r /tmp/production_temp/* ./
          
          git add .
          git commit -m "${{ github.event.head_commit.message }}" || echo "Rien à commit"
          git push origin main