services:
  discord-bot:
    build: .
    #image: ghcr.io/nathael-aa/gge-assistant-bot:latest
    container_name: gge-assistant
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "60011:5011"
    env_file:
      - .env
    environment:
      - DATA_PATH=/app/data
      - TZ=Europe/Paris
    user: "root"
    #user: "1001:1001"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5011/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./assets:/app/assets